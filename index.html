const $=id=>document.getElementById(id),G=$('game');
const names={cube:'KHỐI LẬP PHƯƠNG',box:'KHỐI HỘP CHỮ NHẬT'};
const CUBE_POOL=['rubik_new','dice_new','flowergift','woodcube','glasscube','redgift'];
const BOX_POOL=['fish_new','tissue_new','milk_new','brick_new','eraser','chocolate','lego','foam','speaker_new'];
function shuffled(items){let a=[...items];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function mix(items){return shuffled(items)}
function makeStages(){
 let cubes=shuffled(CUBE_POOL),boxes=shuffled(BOX_POOL);
 let stage1=mix([...cubes.slice(0,2).map(x=>[x,'cube']),...boxes.slice(0,2).map(x=>[x,'box'])]);
 let stage2=mix([...cubes.slice(2,5).map(x=>[x,'cube']),...boxes.slice(2,5).map(x=>[x,'box'])]);
 let stage3=mix([[cubes[5],'cube'],...boxes.slice(5,7).map(x=>[x,'box'])]);
 return [
 {name:'AI TINH MẮT?',hint:'Hãy chọn các đồ vật có dạng khối lập phương!',type:'multi',items:stage1},
 {name:'NGÔI NHÀ BÍ ẨN',hint:'Kéo đồ vật vào đúng nhóm hình khối nhé!',type:'sort',items:stage2},
 {name:'CHIẾC HỘP BÍ MẬT',hint:'Hé lộ đồ vật và đoán xem thuộc khối nào!',type:'reveal',items:stage3}
 ];
}
let stages=makeStages();
let S={stage:0,step:0,points:0,stars:0,stagePoints:0,wrong:0,selected:null,done:[],multi:[],locked:false,sound:true,rewarded:new Set()};let audio;
function svg(type,cls=''){let cube=type==='cube';return cube?`<svg class="${cls}" viewBox="0 0 230 195" role="img" aria-label="Minh họa khối"><polygon points="53,59 89,28 181,28 145,59" fill="#ffd7e1" stroke="#b86684" stroke-width="3" stroke-linejoin="round"/><polygon points="145,59 181,28 181,120 145,151" fill="#cb7693" stroke="#b86684" stroke-width="3" stroke-linejoin="round"/><rect x="53" y="59" width="92" height="92" fill="#f39cb8" stroke="#b86684" stroke-width="3"/></svg>`:`<svg class="${cls}" viewBox="0 0 230 195" role="img" aria-label="Minh họa khối"><polygon points="18,68 54,40 212,40 176,68" fill="#b7eaff" stroke="#4b8eb6" stroke-width="3" stroke-linejoin="round"/><polygon points="176,68 212,40 212,132 176,160" fill="#64b5e7" stroke="#4b8eb6" stroke-width="3" stroke-linejoin="round"/><rect x="18" y="68" width="158" height="92" fill="#92daf9" stroke="#4b8eb6" stroke-width="3"/></svg>`}
function photo(id){return `<img src="${PHOTOS[id]}" alt="Đồ vật cần quan sát" draggable="false">`}
function tone(kind){if(!S.sound)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;audio=audio||new A();if(audio.state==='suspended')audio.resume();let t=audio.currentTime;function beep(f,d,delay=0,w='sine',gain=.13){let o=audio.createOscillator(),g=audio.createGain();o.type=w;o.frequency.value=f;g.gain.setValueAtTime(gain,t+delay);g.gain.exponentialRampToValueAtTime(.001,t+delay+d);o.connect(g).connect(audio.destination);o.start(t+delay);o.stop(t+delay+d)}if(kind==='wrong'){beep(290,.13);beep(220,.22,.17)}else if(kind==='correct'){[523,659,784,1047].forEach((f,i)=>beep(f,.18,i*.09));clap()}else if(kind==='gift'){[523,659,784,988,1175].forEach((f,i)=>beep(f,.18,i*.10))}else{[392,523,659].forEach((f,i)=>beep(f,.13,i*.08))}}catch(e){}}
function clap(){if(!audio)return;let len=Math.floor(audio.sampleRate*.72),b=audio.createBuffer(1,len,audio.sampleRate),a=b.getChannelData(0);for(let i=0;i<len;i++){let p=(Math.sin(i/audio.sampleRate*68)*.5+.5)**16;a[i]=(Math.random()*2-1)*p*.28;}let node=audio.createBufferSource();node.buffer=b;node.connect(audio.destination);node.start()}
function spark(){for(let i=0;i<18;i++){let e=document.createElement('div');e.className='confetti';e.textContent=['⭐','✨','🎊','🌟'][Math.random()*4|0];e.style.left=(Math.random()*90+5)+'vw';e.style.top=(Math.random()*55+30)+'vh';document.body.appendChild(e);setTimeout(()=>e.remove(),1900)}}
function hud(){$('stars').textContent=S.stars;$('points').textContent=S.points}
$('sound').onclick=()=>{S.sound=!S.sound;$('sound').textContent=S.sound?'🔊':'🔇';if(S.sound)tone('gift')};
function header(total,progress){let st=stages[S.stage];return `<div class="stagehead"><div class="stagechip">THỬ THÁCH ${S.stage+1} / ${stages.length}</div><h1 class="title">${st.name}</h1><div class="hint">${st.hint}</div><div class="progress"><i style="width:${Math.round(progress/total*100)}%"></i></div></div>`}
function intro(){G.innerHTML=`<div class="intro"><img class="mascot" src="${MASCOT}" alt="Bạn thám tử nhí cầm kính lúp"><div class="welcome"><div class="stagechip">Bài 14 · Toán lớp 1</div><h1>THÁM TỬ<br>HÌNH KHỐI</h1><p class="hint">Cùng nhận biết khối lập phương và khối hộp chữ nhật!</p><div class="feature"><span>🔍 Quan sát</span><span>🧩 Phân loại</span><span>🎁 Nhận thưởng</span></div><button id="start" class="btn">▶ CHƠI NGAY</button></div></div>`;$('start').onclick=()=>{tone('gift');render()}}
function render(){S.wrong=0;S.locked=false;S.selected=null;let st=stages[S.stage];if(st.type==='multi')multi();else if(st.type==='sort'){S.done=[];sort()}else question()}
function multi(){let st=stages[S.stage];S.multi=[];G.innerHTML=header(1,0)+`<div class="choices">${st.items.map(([id],i)=>`<button class="cardchoice" data-i="${i}" aria-label="Chọn đồ vật ${i+1}">${photo(id)}</button>`).join('')}</div><div class="notice" id="msg">Chọn tất cả đồ vật đúng, rồi nhấn KIỂM TRA!</div><div class="actions"><button id="check" class="btn green">✔ KIỂM TRA</button></div>`;G.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;S.multi=S.multi.includes(i)?S.multi.filter(v=>v!==i):[...S.multi,i];b.classList.toggle('selected')});$('check').onclick=()=>{let expected=st.items.flatMap((a,i)=>a[1]==='cube'?[i]:[]);if(S.multi.length===expected.length&&expected.every(i=>S.multi.includes(i))){G.querySelectorAll('[data-i]').forEach(b=>b.disabled=true);$('check').disabled=true;success(()=>endStage())}else fail('Chưa đúng rồi! Hãy chọn lại nhé!')}}
function sort(){S.locked=false;S.wrong=0;S.selected=null;const st=stages[1];G.innerHTML=header(6,S.done.length)+`<div class="scene"><div class="bank"><div class="banktitle">⭐ THỬ THÁCH: TÌM ĐÚNG HÌNH KHỐI</div><div class="tiles">${st.items.map(([id],i)=>`<button class="tile ${S.done.includes(i)?'done':''}" data-tile="${i}" draggable="${!S.done.includes(i)}" ${S.done.includes(i)?'disabled':''} aria-label="Đồ vật số ${i+1}">${photo(id)}${S.done.includes(i)?'<span class="tick">✓</span>':''}</button>`).join('')}</div></div><div class="targets"><button class="target" data-target="cube"><span class="targettitle">KHỐI LẬP PHƯƠNG</span>${svg('cube','mini')}<span class="count">Đã xếp ${S.done.filter(i=>st.items[i][1]==='cube').length} / 3</span></button><button class="target blue" data-target="box"><span class="targettitle">KHỐI HỘP CHỮ NHẬT</span>${svg('box','mini')}<span class="count">Đã xếp ${S.done.filter(i=>st.items[i][1]==='box').length} / 3</span></button></div></div><div class="notice" id="msg">Chạm đồ vật rồi chọn nhóm, hoặc kéo thả trực tiếp.</div>`;
function select(i){if(S.locked||S.done.includes(i))return;S.selected=i;G.querySelectorAll('[data-tile]').forEach(t=>t.classList.toggle('selected',+t.dataset.tile===i))}
function place(i,target){if(S.locked||i===null||S.done.includes(i))return;if(st.items[i][1]!==target){fail('Chưa đúng nhóm rồi! Em thử lại nhé!');return}S.done.push(i);S.locked=true;success(()=>{if(S.done.length===st.items.length)endStage();else sort()})}
G.querySelectorAll('[data-tile]').forEach(b=>{b.onclick=()=>select(+b.dataset.tile);b.ondragstart=e=>{select(+b.dataset.tile);e.dataTransfer.setData('text/plain',b.dataset.tile);e.dataTransfer.effectAllowed='move'}});G.querySelectorAll('[data-target]').forEach(t=>{t.onclick=()=>{if(S.selected===null){$('msg').textContent='Hãy chọn một đồ vật trước nhé!';return}place(S.selected,t.dataset.target)};t.ondragover=e=>{e.preventDefault();t.classList.add('highlight')};t.ondragleave=()=>t.classList.remove('highlight');t.ondrop=e=>{e.preventDefault();t.classList.remove('highlight');let x=Number(e.dataTransfer.getData('text/plain'));if(Number.isInteger(x)&&x>=0&&x<st.items.length)place(x,t.dataset.target)}})}
function question(){S.wrong=0;S.locked=false;let st=stages[S.stage],entry=st.items[S.step];if(!entry){endStage();return}let visual=entry[0]==='shapeCube'?svg('cube',''):entry[0]==='shapeBox'?svg('box',''):photo(entry[0]);G.innerHTML=header(st.items.length,S.step)+`<div class="largevisual" id="visual">${visual}</div>${st.type==='reveal'?'<div class="actions"><button class="btn secondary" id="reveal">🔎 HÉ LỘ ĐỒ VẬT</button></div>':''}<div class="choices answer">${['cube','box'].map(t=>`<button class="cardchoice" data-answer="${t}" ${st.type==='reveal'?'disabled':''}>${svg(t,'')}${names[t]}</button>`).join('')}</div><div class="notice" id="msg">${st.type==='reveal'?'Nhấn HÉ LỘ để bắt đầu!':'Em hãy chọn tên hình khối đúng!'}</div>`;if(st.type==='reveal'){let v=$('visual');v.style.filter='blur(22px)';v.style.opacity='.38';$('reveal').onclick=()=>{v.style.filter='none';v.style.opacity='1';$('reveal').disabled=true;G.querySelectorAll('[data-answer]').forEach(b=>b.disabled=false);tone('gift');$('msg').textContent='Đồ vật có dạng khối gì?'}}G.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(S.locked)return;if(b.dataset.answer===entry[1]){S.locked=true;b.classList.add('correct');G.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true);success(()=>{S.step++;question()})}else{b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),440);fail('Chưa đúng! Quan sát kỹ lại nhé!')}})}
function fail(txt){S.wrong++;tone('wrong');if($('msg'))$('msg').textContent='Ồ! '+txt}
function success(next){let earn=S.wrong?5:10;S.points+=earn;S.stagePoints+=earn;hud();tone('correct');spark();if($('msg'))$('msg').textContent='Chính xác! '+(earn===10?'+10':'+5')+' điểm';setTimeout(next,1050)}
function endStage(){let id=S.stage;if(S.rewarded.has(id)){advance();return}S.rewarded.add(id);let overlay=document.createElement('div');overlay.className='overlay';overlay.innerHTML=`<div class="dialog"><div class="stagechip">HOÀN THÀNH THỬ THÁCH ${id+1}</div><h2>PHẦN THƯỞNG BẤT NGỜ!</h2><p>Hãy mở hộp quà của em nhé!</p><button class="gift" id="openGift" aria-label="Mở hộp quà">🎁</button><div id="giftResult"></div></div>`;document.body.appendChild(overlay);$('openGift').onclick=()=>{let items=[['⭐ +1 SAO',()=>S.stars+=1],['⭐⭐ +2 SAO',()=>S.stars+=2],['⭐⭐⭐ +3 SAO',()=>S.stars+=3],['🏆 +5 ĐIỂM',()=>S.points+=5],['🏆 +10 ĐIỂM',()=>S.points+=10],['🏆 NHÂN ĐÔI ĐIỂM THỬ THÁCH',()=>S.points+=S.stagePoints]];let pick=items[Math.floor(Math.random()*items.length)];pick[1]();hud();tone('gift');spark();$('openGift').disabled=true;$('openGift').textContent='🎊';$('giftResult').innerHTML=`<div class="reward">${pick[0]}</div><p>Chúc mừng thám tử nhí!</p><button id="goNext" class="btn green">${id===stages.length-1?'🏆 XEM KẾT QUẢ':'▶ THỬ THÁCH TIẾP THEO'}</button>`;$('goNext').onclick=()=>{overlay.remove();advance()}}}
function advance(){S.stage++;S.step=0;S.stagePoints=0;S.locked=false;if(S.stage===stages.length){finish()}else render()}
function finish(){tone('gift');spark();let rank=S.points<40?'THÁM TỬ CHĂM CHỈ':S.points<80?'THÁM TỬ TÀI NĂNG':'THÁM TỬ SIÊU SAO';G.innerHTML=`<div class="end"><div class="badge">🏆</div><h1>CHÚC MỪNG CÁC THÁM TỬ NHÍ!</h1><p class="hint">Em đã hoàn thành cả 3 thử thách!</p><div class="big">${rank}</div><p class="big">⭐ ${S.stars} sao · 🏆 ${S.points} điểm</p><div class="actions"><button class="btn" id="again">↻ CHƠI LẠI</button></div></div>`;$('again').onclick=()=>{S={stage:0,step:0,points:0,stars:0,stagePoints:0,wrong:0,selected:null,done:[],multi:[],locked:false,sound:S.sound,rewarded:new Set()};stages=makeStages();hud();intro()}}
intro();
</script></body></html>
